<!DOCTYPE html>
<html lang="en" data-theme="green">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frame Designer — Creature Cycles</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');

  :root {
    --font:      'Inter', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', 'Courier New', monospace;
    --err: #f87171;
  }

  /* ── DARK (default) ── */
  [data-theme="dark"] {
    --input-bg:    #1a101e;
    --input-fg:    #ddb8e3;
    --bg:          #0d0910;
    --panel-bg:    #0a0810;
    --toolbar-bg:  #130d18;
    --hdr-bg:      #1e1024;
    --border:      #2e1a36;
    --accent:      #6f217a;
    --accent-hi:   #8c2b9a;
    --accent-br:   #b540c5;
    --text-lo:     #3d1f48;
    --text-mid:    #8a6090;
    --text-hi:     #b090b8;
    --text-main:   #f0e8f5;
    --lavender:    #ddb8e3;
    --lavender-br: #eacced;
  }

  /* ── LIGHT ── */
  [data-theme="light"] {
    --input-bg:    #fafafa;
    --input-fg:    #081c15;
    --bg:          #F0F5FA;
    --panel-bg:    #ffffff;
    --toolbar-bg:  #eef7f1;
    --hdr-bg:      #d8f3dc;
    --border:      #b7e4c7;
    --accent:      #1b4332;
    --accent-hi:   #2d6a4f;
    --accent-br:   #40916c;
    --text-lo:     #95d5b2;
    --text-mid:    #2d6a4f;
    --text-hi:     #1b4332;
    --text-main:   #1e293b;
    --lavender:    #1b4332;
    --lavender-br: #2d6a4f;
  }

  /* ── GREEN ── */
  [data-theme="green"] {
    --input-bg:    #28272a;
    --input-fg:    #86efac;
    --bg:          #28272a;
    --panel-bg:    #222124;
    --toolbar-bg:  #2e2d31;
    --hdr-bg:      #333136;
    --border:      #1a3d20;
    --accent:      #166534;
    --accent-hi:   #16a34a;
    --accent-br:   #22c55e;
    --text-lo:     #14532d;
    --text-mid:    #4ade80;
    --text-hi:     #86efac;
    --text-main:   #dcfce7;
    --lavender:    #4ade80;
    --lavender-br: #86efac;
  }

  /* ── ORANGE ── */
  [data-theme="orange"] {
    --input-bg:    #1e1005;
    --input-fg:    #fde68a;
    --bg:          #0f0a04;
    --panel-bg:    #0d0902;
    --toolbar-bg:  #1a1005;
    --hdr-bg:      #2a1a08;
    --border:      #3d2810;
    --accent:      #92400e;
    --accent-hi:   #d97706;
    --accent-br:   #f59e0b;
    --text-lo:     #78350f;
    --text-mid:    #d97706;
    --text-hi:     #fbbf24;
    --text-main:   #fef3c7;
    --lavender:    #fbbf24;
    --lavender-br: #fde68a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }

  body {
    background: var(--bg);
    color: var(--text-main);
    font-family: var(--font);
    font-size: 14px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Toolbar ── */
  #toolbar {
    background: var(--toolbar-bg);
    border-bottom: 1px solid var(--border);
    height: 34px;
    display: flex;
    align-items: center;
    padding: 0 10px;
    gap: 0;
    flex-shrink: 0;
  }

  #logo-area {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin-right: 14px;
  }

  #logo-text {
    font-size: 13px;
    font-weight: 700;
    color: var(--lavender);
    letter-spacing: 3px;
    font-style: normal;
    text-transform: uppercase;
    font-family: var(--font-mono);
  }

  #logo-sub {
    font-size: 9px;
    color: var(--text-lo);
    letter-spacing: 2px;
    text-transform: lowercase;
  }

  .tb-sep {
    width: 1px;
    height: 18px;
    background: var(--border);
    margin: 0 7px;
  }

  .tb-btn {
    background: none;
    border: none;
    color: var(--text-mid);
    font-family: var(--font);
    font-size: 12px;
    padding: 4px 10px;
    cursor: pointer;
    border-radius: 3px;
    transition: background 0.15s, color 0.15s;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }
  .tb-btn:hover { background: var(--hdr-bg); color: var(--lavender); }
  .tb-btn.on { color: var(--accent-br); }

  #tb-right { display: none; }

  /* ── Main layout ── */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Param panel ── */
  #panel {
    width: 290px;
    min-width: 200px;
    background: var(--panel-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
    height: 100%;  /* always fill full height — never shrinks when groups collapse */
  }

  #panel-scroll {
    overflow-y: auto;
    flex: 1;
    padding-bottom: 8px;
  }

  #panel-scroll::-webkit-scrollbar { width: 6px; }
  #panel-scroll::-webkit-scrollbar-track { background: var(--panel-bg); }
  #panel-scroll::-webkit-scrollbar-thumb { background: var(--hdr-bg); border-radius: 3px; }
  #panel-scroll::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  .group-wrap { margin: 0; }

  .group-hdr {
    display: flex;
    align-items: stretch;
    cursor: pointer;
    margin-top: 4px;
    user-select: none;
  }

  .group-accent {
    width: 3px;
    background: var(--accent);
    flex-shrink: 0;
  }

  .group-btn {
    flex: 1;
    background: var(--hdr-bg);
    color: var(--lavender-br);
    font-family: var(--font);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    padding: 7px 10px;
    border: none;
    text-align: left;
    cursor: pointer;
    transition: background 0.1s, color 0.1s;
  }
  .group-btn:hover { background: var(--accent); color: #fff; }

  .group-body {
    padding: 2px 8px 4px 11px;
    background: var(--panel-bg);
  }
  .group-body.collapsed { display: none; }











  /* ── param row: two-line layout (label + slider+arrows+input) ── */
  .param-row {
    display: flex;
    flex-direction: column;
    padding: 4px 0 2px;
    gap: 2px;
  }

  .param-label {
    color: var(--text-hi);
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 0;
  }

  /* slider row: ← [range] → [value] */
  .slider-row {
    display: flex;
    align-items: center;
    gap: 3px;
    width: 100%;
  }

  .arrow-btn {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    background: var(--hdr-bg);
    border: 1px solid var(--border);
    border-radius: 2px;
    color: var(--text-mid);
    font-size: 10px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.1s, color 0.1s;
    padding: 0;
    font-family: var(--font);
  }
  .arrow-btn:hover { background: var(--accent); color: var(--lavender-br); }
  .arrow-btn:active { background: var(--accent-hi); }

  .param-slider {
    flex: 1;
    height: 28px;          /* tall hit area for touch */
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    cursor: pointer;
    outline: none;
    min-width: 0;
    touch-action: none;    /* let us handle touch without scroll conflict */
  }

  /* Track */
  .param-slider::-webkit-slider-runnable-track {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
  }
  .param-slider::-moz-range-track {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
  }

  /* Thumb — desktop */
  .param-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 16px;
    border-radius: 3px;
    background:
      repeating-linear-gradient(
        to right,
        transparent 0px, transparent 2px,
        rgba(255,255,255,0.45) 2px, rgba(255,255,255,0.45) 3px
      ) center / 60% 100% no-repeat,
      var(--accent);
    border: 1px solid var(--accent-hi);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 1px 3px rgba(0,0,0,0.25);
    margin-top: -6px;
    cursor: grab;
    transition: background-color 0.1s;
  }
  .param-slider:active::-webkit-slider-thumb { background-color: var(--accent-hi); cursor: grabbing; }
  .param-slider::-webkit-slider-thumb:hover  { background-color: var(--accent-hi); }
  .param-slider::-moz-range-thumb {
    width: 14px; height: 16px; border-radius: 3px;
    background:
      repeating-linear-gradient(
        to right,
        transparent 0px, transparent 2px,
        rgba(255,255,255,0.45) 2px, rgba(255,255,255,0.45) 3px
      ) center / 60% 100% no-repeat,
      var(--accent);
    border: 1px solid var(--accent-hi);
  }

  /* Mobile — bigger thumb, fatter track */
  @media (max-width: 900px) {
    .param-slider {
      height: 36px;
    }
    .param-slider::-webkit-slider-runnable-track {
      height: 5px;
    }
    .param-slider::-webkit-slider-thumb {
      width: 26px;
      height: 26px;
      margin-top: -10.5px;
      border-width: 3px;
    }
    .param-slider::-moz-range-thumb {
      width: 26px;
      height: 26px;
    }
    .arrow-btn {
      width: 28px;
      height: 28px;
      font-size: 14px;
    }
    .wheel-val {
      font-size: 13px;
      padding: 4px 6px;
    }
  }

  .param-input {
    width: 58px;
    background: var(--input-bg);
    color: var(--input-fg);
    border: 1px solid var(--accent);
    border-radius: 2px;
    padding: 2px 4px;
    font-family: var(--font-mono);
    font-size: 11px;
    text-align: right;
    outline: none;
    flex-shrink: 0;
  }
  .param-input:focus { border-color: var(--accent-br); }

  /* Wheel toggle row: ← [label] → */
  .wheel-toggle-row {
    display: flex;
    align-items: center;
    gap: 3px;
    width: 100%;
  }
  .wheel-val {
    flex: 1;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--lavender-br);
    font-family: var(--font-mono);
    background: var(--hdr-bg);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 2px 4px;
  }

  /* select stays for BB standard */
  .param-select {
    width: 100%;
    background: var(--input-bg);
    color: var(--input-fg);
    border: 1px solid var(--accent);
    border-radius: 2px;
    padding: 3px 4px;
    font-family: var(--font);
    font-size: 12px;
    outline: none;
  }

  /* Derived readout */
  .derived-row {
    display: flex;
    justify-content: space-between;
    padding: 5px 8px 5px 11px;
    font-size: 12px;
    color: var(--text-mid);
    border-top: 1px solid var(--border);
    margin-top: 2px;
  }
  .derived-val { color: var(--lavender-br); font-weight: 700; font-family: var(--font-mono); }

  /* Panel buttons */
  #panel-btns {
    display: flex;
    gap: 6px;
    padding: 8px 10px 6px;
    border-top: 1px solid var(--border);
    background: var(--panel-bg);
    flex-shrink: 0;
  }
  .panel-btn {
    flex: 1;
    background: var(--hdr-bg);
    color: var(--lavender);
    border: 1px solid var(--accent);
    border-radius: 3px;
    font-family: var(--font);
    font-size: 12px;
    font-weight: 600;
    padding: 7px 4px;
    cursor: pointer;
    letter-spacing: 0.3px;
    transition: background 0.1s, color 0.1s;
  }
  .panel-btn:hover { background: var(--accent); color: #fff; }

  /* Status bar */
  #statusbar {
    background: var(--panel-bg);
    border-top: 1px solid var(--border);
    color: var(--text-mid);
    font-size: 11px;
    padding: 4px 12px;
    flex-shrink: 0;
    white-space: nowrap;
    overflow: hidden;
  }

  /* ── Canvas area ── */
  #canvas-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  #canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: grab;
  }
  #canvas:active { cursor: grabbing; }

  /* ── Preset panel (floating bottom-right) ── */
  #preset-panel {
    position: absolute;
    bottom: 44px;
    right: 12px;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    min-width: 160px;
    z-index: 10;
  }

  #preset-body { padding: 6px; display: block; }

  .preset-row {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 4px;
  }
  .preset-row select {
    width: 100%;
    background: var(--input-bg);
    color: var(--input-fg);
    border: 1px solid var(--accent);
    border-radius: 2px;
    font-family: var(--font);
    font-size: 10px;
    padding: 2px 4px;
    outline: none;
  }

  #preset-load {
    width: 100%;
    background: var(--hdr-bg);
    color: var(--accent-br);
    border: none;
    font-family: var(--font);
    font-size: 12px;
    font-weight: 600;
    padding: 7px;
    cursor: pointer;
    border-radius: 2px;
    margin-top: 4px;
    letter-spacing: 0.3px;
    transition: background 0.15s;
  }
  #preset-load:hover { background: var(--accent); color: #fff; }

  /* Resizer */
  #resizer {
    width: 4px;
    background: var(--border);
    cursor: col-resize;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  #resizer:hover { background: var(--accent-hi); }

  /* theme selector */
  #theme-sel {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text-mid);
    font-family: var(--font);
    font-size: 11px;
    padding: 4px 6px;
    cursor: pointer;
    outline: none;
    transition: border-color 0.15s, color 0.15s;
  }
  #theme-sel:hover { border-color: var(--accent-br); color: var(--lavender); }
  #theme-sel option { background: var(--toolbar-bg); color: var(--text-main); }

  /* ════════════════════════════════════════════════
     MOBILE / TABLET RESPONSIVE
     ════════════════════════════════════════════════ */

  /* Tablet: narrow panel, hide logo subtitle */
  @media (max-width: 900px) {
    #panel { width: 240px; min-width: 180px; }
    #logo-sub { display: none; }
    .tb-btn { padding: 5px 8px; font-size: 11px; }
    #logo-text { font-size: 12px; letter-spacing: 2px; }
  }

  /* Mobile: swipeable panel + compact header */
  @media (max-width: 600px) {
    body { overflow: hidden; height: auto; }
    #main { flex: none; }

    /* Hide desktop elements */
    #toolbar      { display: none !important; }
    #preset-panel { display: none !important; }
    #zoom-controls { display: none !important; }
    /* Derived-row (Wheelbase) is duplicated in statusbar — hide above buttons */
    #panel .derived-row { display: none; }

    /* Show floating options button */
    #options-btn     { display: block !important; }

    /* Panel becomes a bottom sheet; position:relative makes it containing block for view-panel */
    #main { flex-direction: column-reverse; position: relative; justify-content: flex-end; overflow: hidden; }

    #panel {
      width: 100% !important;
      height: 48vh;
      min-width: unset;
      border-right: none;
      border-top: 2px solid var(--accent);
      flex-shrink: 0;
      overflow: hidden;
    }

    #resizer { display: none; }

    #canvas-wrap { flex: none; height: 34vh; min-height: 100px; border-top: 3px solid var(--accent); }
    #panel { height: auto !important; flex: 1; min-height: 180px; max-height: 55vh; }

    /* Compact param rows */
    .param-row    { padding: 1px 0; gap: 0; }
    .param-label  { font-size: 10px; line-height: 1.2; padding: 0; white-space: nowrap; overflow: hidden; }
    .param-slider { height: 36px; }
    .param-slider::-webkit-slider-runnable-track { height: 3px; }
    .param-slider::-webkit-slider-thumb { width: 16px; height: 18px; border-radius: 3px; margin-top: -7.5px; border-width: 1px; }
    .param-slider::-moz-range-thumb { width: 16px; height: 18px; border-radius: 3px; }
    .param-input  { width: 52px; font-size: 10px; }
    .arrow-btn    { width: 16px; height: 16px; font-size: 9px; }
    .wheel-val    { font-size: 11px; padding: 1px 3px; }
    .param-select { font-size: 10px; padding: 2px 3px; }

    /* Compact panel footer */
    #panel-btns   { padding: 3px 8px; gap: 4px; }
    .panel-btn    { font-size: 11px; padding: 4px 4px; }
    .derived-row  { padding: 2px 8px 2px 11px; font-size: 11px; }
  }

  /* ── Mobile header — hidden on desktop, shown on mobile ── */
  /* ── Options button — absolute in canvas-wrap, mobile only ── */
  #options-btn {
    display: none;
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 200;
    background: var(--accent);
    border: none;
    color: #fff;
    font-family: var(--font);
    font-size: 10px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 11px;
    cursor: pointer;
    letter-spacing: 0.5px;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s;
  }
  #options-btn.active { background: var(--accent-hi); }
  #options-btn:active  { background: var(--accent-hi); }


  /* ── View panel (absolute within #main, covers canvas + panel) ── */
  #view-panel {
    display: none;
    position: absolute;
    top: 76px; left: 0; right: 0;
    background: var(--panel-bg);
    border-bottom: 2px solid var(--accent);
    box-shadow: 0 8px 32px rgba(0,0,0,0.22);
    z-index: 190;
    overflow-y: auto;
    max-height: 100%;
  }
  #view-panel.open { display: block; }
  #view-panel-inner {
    padding: 10px 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .vp-section-title {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-mid);
    margin-bottom: 5px;
    font-family: var(--font-mono);
  }
  .vp-btn-row {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
  }
  /* generic view-panel button */
  .vp-btn {
    font-family: var(--font);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 3px;
    border: 1px solid var(--border);
    background: var(--hdr-bg);
    color: var(--text-mid);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.12s, color 0.12s;
    white-space: nowrap;
  }
  .vp-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .vp-btn:active { opacity: 0.8; }
  /* divider between sections */
  .vp-divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 0;
  }
  /* preset row inside view panel */
  .vp-preset-row {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }
  .vp-preset-row select {
    flex: 1;
    min-width: 90px;
    background: var(--input-bg);
    color: var(--input-fg);
    border: 1px solid var(--accent);
    border-radius: 2px;
    font-family: var(--font);
    font-size: 11px;
    padding: 5px 4px;
    outline: none;
  }
  /* backdrop to close panel when tapping canvas */
  #view-panel-backdrop {
    display: none;
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 188;
  }
  #view-panel-backdrop.open { display: block; }

  /* ── Mobile pager ── */
  #panel-scroll.mobile-pager {
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding-bottom: 0;
  }
  /* ── Title bar with inline nav arrows ── */
  #mob-page-hdr {
    display: flex;
    align-items: center;
    padding: 3px 6px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    gap: 6px;
  }
  #mob-page-title {
    flex: 1;
    text-align: center;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--lavender-br);
    font-family: var(--font-mono);
  }
  .mob-page-nav-btn {
    width: 16px;
    height: 16px;
    background: var(--hdr-bg);
    border: 1px solid var(--border);
    border-radius: 2px;
    color: var(--text-mid);
    font-size: 9px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    flex-shrink: 0;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s, color 0.15s;
  }
  .mob-page-nav-btn:active  { background: var(--accent); color: #fff; }

const DEG = Math.PI / 180;
const TUBE_LW = 0.5;   // frame tube stroke weight
const WHEEL_LW = 0.5;  // wheel stroke weight
const r2d = a => a / DEG;
const d2r = a => a * DEG;
const add = (a,b) => [a[0]+b[0], a[1]+b[1]];
const sub = (a,b) => [a[0]-b[0], a[1]-b[1]];
const mul = (v,s) => [v[0]*s, v[1]*s];
const dot = (a,b) =>  a[0]*b[0] + a[1]*b[1];
const hypot = (a,b) => Math.hypot(a,b);
const norm = v => { const d=hypot(v[0],v[1]); return d>0?[v[0]/d,v[1]/d]:v; };
const perp_cw  = v => [ v[1],-v[0]];
const perp_ccw = v => [-v[1], v[0]];

function arcPts(cx,cy,r,a0,a1,n=12) {
  const pts=[];
  for(let i=0;i<=n;i++){
    const a = a0+(a1-a0)*i/n;
    pts.push([cx+r*Math.cos(a), cy+r*Math.sin(a)]);
  }
  return pts;
}

function semicap(tip,ax,hw,cw=true,n=8) {
  const ba=Math.atan2(ax[1],ax[0]), sign=cw?-1:1;
  return arcPts(tip[0],tip[1],hw, ba+sign*Math.PI/2, ba-sign*Math.PI/2, n);
}

function bez(p0,p1,p2,p3,n=16) {
  const pts=[];
  for(let i=0;i<=n;i++){
    const t=i/n,mt=1-t;
    pts.push([
      mt**3*p0[0]+3*mt**2*t*p1[0]+3*mt*t**2*p2[0]+t**3*p3[0],
      mt**3*p0[1]+3*mt**2*t*p1[1]+3*mt*t**2*p2[1]+t**3*p3[1],
    ]);
  }
  return pts;
}

function chainringRadius(teeth) {
  return (teeth*12.7)/(2*Math.PI) + 4.0;
}

//  GEOMETRY ENGINE
// ═══════════════════════════════════════════════════════
function computeGeometry(p) {
  const ha  = d2r(p.ht_angle);
  const sa  = d2r(p.st_angle);
  const tw  = p.tyre_width || 57;            // tyre section width ≈ section height (round cross-section)
  const rwd = p.rear_wheel_dia/2  + tw;     // outer radius = rim_BSD/2 + tyre_width
  const fwd = p.front_wheel_dia/2 + tw;
  const bb  = [0,0];

  const cs      = p.chainstay_length;
  const cs_horiz= Math.sqrt(Math.max(cs*cs - p.bb_drop*p.bb_drop, 0));
  const rear_axle = [-cs_horiz, p.bb_drop];

  const seat_cluster = [
    -p.st_length*Math.cos(sa),
     p.st_length*Math.sin(sa),
  ];

  const fork_axis = [ Math.cos(ha), -Math.sin(ha)];
  const fork_perp = [ Math.sin(ha),  Math.cos(ha)];
  const fo  = p.fork_offset;
  const atc = p.fork_atc;
  const lhh = p.lower_headset_height;

  const ground_y    = p.bb_drop - rwd;
  const front_axle_y= ground_y + fwd;
  const f_along     = Math.sqrt(Math.max(0, atc*atc - fo*fo));

  const front_axle_x = p.reach + (f_along+lhh+p.ht_length)*Math.cos(ha) + fo*Math.sin(ha);
  const front_axle   = [front_axle_x, front_axle_y];

  const fork_crown = [
    front_axle[0] - f_along*fork_axis[0] - fo*fork_perp[0],
    front_axle[1] - f_along*fork_axis[1] - fo*fork_perp[1],
  ];
  const ht_bot = [
    fork_crown[0] - lhh*fork_axis[0],
    fork_crown[1] - lhh*fork_axis[1],
  ];
  const ht_top = [
    ht_bot[0] - p.ht_length*fork_axis[0],
    ht_bot[1] - p.ht_length*fork_axis[1],
  ];
  const stack = ht_top[1];

  const t_to_gnd   = (ht_bot[1]-ground_y)/Math.sin(ha);
  const steer_gnd_x= ht_bot[0]+t_to_gnd*fork_axis[0];
  const trail      = steer_gnd_x - front_axle[0];
  const wheelbase  = front_axle[0] - rear_axle[0];
  const front_centre=Math.hypot(front_axle[0], p.bb_drop);

  const hb_d = Math.hypot(...ht_bot);
  const dt_ax= hb_d>0 ? [ht_bot[0]/hb_d, ht_bot[1]/hb_d] : [1,0];

  const ra_d    = Math.hypot(...rear_axle);
  const cs_ax_bs= ra_d>0 ? [rear_axle[0]/ra_d,rear_axle[1]/ra_d] : [-1,0];
  const bs_dir  = [-cs_ax_bs[0],-cs_ax_bs[1]];

  const drop_a = d2r(p.cs_ds_drop_angle||6);
  const ca=Math.cos(-drop_a), s2=Math.sin(-drop_a);
  const ds_dir = [bs_dir[0]*ca-bs_dir[1]*s2, bs_dir[0]*s2+bs_dir[1]*ca];
  const cs_ax_ds = [-ds_dir[0],-ds_dir[1]];

  const ds_t  = p.chainstay_length*0.80;
  const ds_end= [rear_axle[0]+ds_dir[0]*ds_t, rear_axle[1]+ds_dir[1]*ds_t];

  const st_ax = [-Math.cos(sa), Math.sin(sa)];

  return {
    bb, rear_axle, seat_cluster, ht_top, ht_bot,
    fork_crown, front_axle, fork_axis, fork_perp,
    fork_atc:atc, fork_along:f_along, stack,
    ground_y, rwd, fwd, trail, wheelbase, front_centre,
    dt_ax, cs_ax:cs_ax_bs, cs_ax_bs, cs_ax_ds, bs_dir, ds_dir,
    bs_end:[0,0], ds_end, st_ax,
  };
}

// ═══════════════════════════════════════════════════════
//  BB YOKE (translated from Python)
// ═══════════════════════════════════════════════════════
function bbYokeDsMM(g, p) {
  // DS yoke: tangent lines from CS tube shoulders at ds_end to BB shell arc
  const ds_end = g.ds_end;
  const ds_dir = g.ds_dir;
  const cs_od  = p.cs_OD;
  const bb_r   = p.bb_diameter / 2;   // shell outer radius

  const perp_up = perp_ccw(ds_dir);
  const perp_dn = perp_cw(ds_dir);
  const P_top = [ds_end[0]+perp_up[0]*cs_od/2, ds_end[1]+perp_up[1]*cs_od/2];
  const P_bot = [ds_end[0]+perp_dn[0]*cs_od/2, ds_end[1]+perp_dn[1]*cs_od/2];

  function tangentPts(P, r) {
    const d = Math.hypot(P[0], P[1]);
    if (d <= r + 0.1) return [null, null];
    const ang   = Math.atan2(P[1], P[0]);
    const alpha = Math.acos(Math.min(1.0, r / d));
    return [
      [r*Math.cos(ang+alpha), r*Math.sin(ang+alpha)],
      [r*Math.cos(ang-alpha), r*Math.sin(ang-alpha)],
    ];
  }

  function cross2d(a, b) { return a[0]*b[1] - a[1]*b[0]; }

  const [T_top_1, T_top_2] = tangentPts(P_top, bb_r);
  if (!T_top_1) return [];
  const to_o_top = [-P_top[0], -P_top[1]];
  const v1 = [T_top_1[0]-P_top[0], T_top_1[1]-P_top[1]];
  const T_top = cross2d(to_o_top, v1) > 0 ? T_top_1 : T_top_2;

  const [T_bot_1, T_bot_2] = tangentPts(P_bot, bb_r);
  if (!T_bot_1) return [];
  const to_o_bot = [-P_bot[0], -P_bot[1]];
  const v2 = [T_bot_1[0]-P_bot[0], T_bot_1[1]-P_bot[1]];
  const T_bot = cross2d(to_o_bot, v2) < 0 ? T_bot_1 : T_bot_2;

  let ang_top = Math.atan2(T_top[1], T_top[0]);
  let ang_bot = Math.atan2(T_bot[1], T_bot[0]);
  while (ang_bot > ang_top) ang_bot -= 2*Math.PI;
  const bb_arc = arcPts(0, 0, bb_r, ang_top, ang_bot, 20);

  const outline = [P_top, T_top, ...bb_arc.slice(1), P_bot];
  return outline;
}

function mmToScreen(x,y) {

}

// ── Resize ──
function resizeCanvas(){
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;
  if(w > 0 && h > 0){
    dpr   = window.devicePixelRatio || 1;
    cssW  = w;  cssH  = h;
    canvas.width  = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width  = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fitView();  // refit scale/horizontal when canvas changes size
  }
  redraw();
}
window.addEventListener('resize', resizeCanvas);

// ── Zoom / Pan ──
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  viewPinned=false;
  const f = e.deltaY<0?1.1:1/1.1;
  scale *= f;
  redraw();
}, {passive:false});

canvas.addEventListener('mousedown', e=>{ viewPinned=false; drag=[e.clientX,e.clientY,offset[0],offset[1],groundFraction]; canvas.style.cursor='grabbing'; });
window.addEventListener('mousemove', e=>{
  if(!drag) return;
  offset[0] = drag[2] + (e.clientX - drag[0]);
  offset[1] = drag[3] + (e.clientY - drag[1]);
  redraw();
});
window.addEventListener('mouseup', ()=>{ drag=null; canvas.style.cursor='grab'; });

// Touch
let pinchDist0 = null;
let pinchScale0 = null;

canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    viewPinned=false;
    const t = e.touches[0];
    drag = [t.clientX, t.clientY, offset[0], offset[1], groundFraction];
    pinchDist0 = null;
  } else if (e.touches.length === 2) {
    drag = null;
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchDist0 = Math.hypot(dx, dy);
    pinchScale0 = scale;
  }
}, {passive: true});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 2 && pinchDist0 !== null) {
    // Pinch to zoom — scale around midpoint of two fingers
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    const newScale = pinchScale0 * (dist / pinchDist0);
    // Keep midpoint of fingers fixed in world space
    const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    const rect = canvas.getBoundingClientRect();
    const cx = mx - rect.left, cy = my - rect.top;
    // Adjust offset so zoom centres on finger midpoint
    const wx = (cx - cssW/2  - offset[0]) / scale;
    const wy = (cy - cssH/2 - offset[1]) / (-scale);
    scale = Math.max(0.05, Math.min(5, newScale));
    offset[0] = cx - cssW/2  - wx * scale;
    // Update groundFraction to match new offset[1] target
    // wy is in mm (Y-up), ground_y is in mm
    // We want pinGroundY to produce the same gy as the pinch centre intended.
    // New offset[1] would be: cy - H/2 + wy * scale
    // pinGroundY sets offset[1] = H*(gF-0.5) + g.ground_y*scale
    // So gF = (cy - H/2 + wy*scale - g.ground_y*scale) / H + 0.5
    //       = (cy - H/2 + (wy - g.ground_y)*scale) / H + 0.5
    // We don't have g here so just approximate with current groundFraction
    // adjusted for scale change:
    const tentativeOff1 = cy - cssH/2 + wy * scale;
    // Infer what groundFraction gives this offset:
    // tentativeOff1 = H*(gF-0.5) + g_y_approx*scale
    // We'll just do a raw fraction from the intended screen ground position
    // ground_screen_approx = H/2 + tentativeOff1 - g.ground_y_approx * scale
    // Since we don't recompute g here, just keep groundFraction and let pinGroundY
    // recalculate on next redraw. The horizontal zoom is what matters for pinch.
    redraw();
  } else if (e.touches.length === 1 && drag) {
    const t = e.touches[0];
    offset[0] = drag[2] + (t.clientX - drag[0]);
    offset[1] = drag[3] + (t.clientY - drag[1]);
    redraw();
  }
}, {passive: false});

canvas.addEventListener('touchend', e => {
  if (e.touches.length < 2) pinchDist0 = null;
  if (e.touches.length === 0) drag = null;
}, {passive: true});

// Fill-only rectangle for a tube segment (no caps, no stroke) — used as mask
function tubeRect(pt1, pt2, od, fill) {
  const dx=pt2[0]-pt1[0], dy=pt2[1]-pt1[1];
  const L=Math.hypot(dx,dy);
  if(L<0.5) return;
  const p_=[-dy/L, dx/L];
  const hw=od/2;
  const c1a=add(pt1,mul(p_, hw));
  const c1b=add(pt1,mul(p_,-hw));
  const c2a=add(pt2,mul(p_, hw));
  const c2b=add(pt2,mul(p_,-hw));
  const pts=[c1a,c2a,c2b,c1b];
  ctx.beginPath();
  const [x0,y0]=mmToScreen(pts[0][0],pts[0][1]);
  ctx.moveTo(x0,y0);
  for(let i=1;i<pts.length;i++){
    const [x,y]=mmToScreen(pts[i][0],pts[i][1]);
    ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fillStyle=fill;
  ctx.fill();
}


// Sutherland-Hodgman clip of polygon against a single half-plane.
// Keeps points where dot(pt - planePoint, planeNormal) <= 0.
function clipHalfPlane(poly, planeNormal, planePoint) {
  if (poly.length === 0) return [];
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const curr = poly[i];
    const next = poly[(i + 1) % poly.length];
    const dc = dot(sub(curr, planePoint), planeNormal);
    const dn = dot(sub(next, planePoint), planeNormal);
    if (dc <= 0) out.push(curr);           // curr inside → keep
    if ((dc < 0 && dn > 0) || (dc > 0 && dn < 0)) {
      // Edge crosses plane → add intersection
      const t = dc / (dc - dn);
      out.push(add(curr, mul(sub(next, curr), t)));
    }
  }
  return out;
}

// Return the 4 corner points of a tube rectangle in mm (no caps).
function tubeCorners(pt1, pt2, od) {
  const dx=pt2[0]-pt1[0], dy=pt2[1]-pt1[1];
  const L=Math.hypot(dx,dy);
  if (L < 0.5) return [];
  const p_=[-dy/L, dx/L];
  const hw = od / 2;
  return [
    add(pt1, mul(p_, hw)),
    add(pt2, mul(p_, hw)),
    add(pt2, mul(p_,-hw)),
    add(pt1, mul(p_,-hw)),
  ];
}

// Draw a clipped tube: compute rect corners, clip, draw polygon.
function tubePolyClipped(pt1, pt2, od, fill, stroke, clipNormal, clipPoint) {
  let poly = tubeCorners(pt1, pt2, od);
  poly = clipHalfPlane(poly, clipNormal, clipPoint);
  if (poly.length >= 3) drawPoly(poly, fill, stroke, 1);
}

function drawPoly(mmPts, fill, stroke, lw=1) {
  if(mmPts.length<2) return;
  ctx.beginPath();
  const [x0,y0]=mmToScreen(mmPts[0][0],mmPts[0][1]);
  ctx.moveTo(x0,y0);
  for(let i=1;i<mmPts.length;i++){
    const [x,y]=mmToScreen(mmPts[i][0],mmPts[i][1]);
    ctx.lineTo(x,y);
  }
  ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}
}

function tubePoly(pt1,pt2,od,fill,stroke,cap1=true,cap2=true,cap1_inset=0,cap2_inset=0){
  const dx=pt2[0]-pt1[0], dy=pt2[1]-pt1[1];
  const L=Math.hypot(dx,dy);
  if(L<0.5) return;
  const ax=[dx/L,dy/L];
  const hw=od/2;
  const p_=[- dy/L, dx/L];

  const c1a=add(pt1,mul(p_, hw));
  const c1b=add(pt1,mul(p_,-hw));
  const c2a=add(pt2,mul(p_, hw));
  const c2b=add(pt2,mul(p_,-hw));
  drawPoly([c1a,c2a,c2b,c1b],fill,stroke,TUBE_LW);

  if(cap1){
    const cp1=add(pt1,mul(ax, cap1_inset));
    drawPoly(semicap(cp1,[-ax[0],-ax[1]],hw,false,8),fill,stroke,TUBE_LW);
  }
  if(cap2){
    const cp2=add(pt2,mul(ax,-cap2_inset));
    drawPoly(semicap(cp2,ax,hw,true,8),fill,stroke,TUBE_LW);
  }
}

function line(x1,y1,x2,y2,col,lw=1,dash=[]){
  const [sx1,sy1]=mmToScreen(x1,y1);
  const [sx2,sy2]=mmToScreen(x2,y2);
  ctx.beginPath();
  ctx.setLineDash(dash);
  ctx.strokeStyle=col; ctx.lineWidth=lw;
  ctx.moveTo(sx1,sy1); ctx.lineTo(sx2,sy2);
  ctx.stroke();
  ctx.setLineDash([]);
}

function lineS(sx1,sy1,sx2,sy2,col,lw=1,dash=[]){
  ctx.beginPath();
  ctx.setLineDash(dash);
  ctx.strokeStyle=col; ctx.lineWidth=lw;
  ctx.moveTo(sx1,sy1); ctx.lineTo(sx2,sy2);
  ctx.stroke();
  ctx.setLineDash([]);
}

function arrowH(sx1,sx2,sy,col,lw=1){
  lineS(sx1,sy,sx2,sy,col,lw);
  // arrowheads
  const d=5;
  lineS(sx1,sy, sx1+d,sy-d, col,lw);
  lineS(sx1,sy, sx1+d,sy+d, col,lw);
  lineS(sx2,sy, sx2-d,sy-d, col,lw);
  lineS(sx2,sy, sx2-d,sy+d, col,lw);
}

function arrowV(sy1,sy2,sx,col,lw=1){
  lineS(sx,sy1,sx,sy2,col,lw);
  const d=5;
  lineS(sx,sy1, sx-d,sy1+d, col,lw);
  lineS(sx,sy1, sx+d,sy1+d, col,lw);
  lineS(sx,sy2, sx-d,sy2-d, col,lw);
  lineS(sx,sy2, sx+d,sy2-d, col,lw);
}

function label(sx,sy,text,col,align='center',baseline='middle',size=10){
  ctx.fillStyle=col;
  ctx.font=`${size}px 'Inter',system-ui,sans-serif`;
  ctx.textAlign=align; ctx.textBaseline=baseline;
  ctx.fillText(text,sx,sy);
}

function drawDot(sx,sy,r,fill,stroke){
  ctx.beginPath();
  ctx.arc(sx,sy,r,0,Math.PI*2);
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}
}

// ═══════════════════════════════════════════════════════
//  DRAW GRID
// ═══════════════════════════════════════════════════════
function drawGrid(g){
  const w=cssW, h=cssH;
  const step=50*scale;
  if(step<4) return;
  const cx=cssW/2+offset[0], cy=cssH/2+offset[1];
  ctx.strokeStyle=T('grid'); ctx.lineWidth=1;
  const xi0=Math.floor(-cx/step)-1;
  for(let xi=xi0; xi*step+cx<w+step; xi++){
    const x=xi*step+cx;
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke();
  }
  const yi0=Math.floor(-cy/step)-1;
  for(let yi=yi0; yi*step+cy<h+step; yi++){
    const y=yi*step+cy;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke();
  }
  // Ground line
  const [,gy]=mmToScreen(0,g.ground_y);
  ctx.strokeStyle=T('ground'); ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(w,gy); ctx.stroke();
  label(w-8,gy-5,'ground',T('ground'),'right','bottom',9);
}

// ═══════════════════════════════════════════════════════
//  DRAW WHEELS
// ═══════════════════════════════════════════════════════
function drawWheels(g){
  const WCOL = T('wheel');
  const RSTK = T('tubeStk');
  const RFIL = T('tubeFill');
  const tw   = params.tyre_width || 57;  // tyre section width = section height (round cross-section)

  for(const [cx_mm, cy_mm, outerR_mm, bsd_mm] of [
    [g.rear_axle[0],  g.rear_axle[1],  g.rwd, params.rear_wheel_dia],
    [g.front_axle[0], g.front_axle[1], g.fwd, params.front_wheel_dia],
  ]){
    const [sx,sy]  = mmToScreen(cx_mm, cy_mm);
    const rOuter   = px(outerR_mm);              // outer tyre radius = BSD/2 + tyre_width
    const rBSD     = px(bsd_mm / 2);             // BSD / bead seat circle (tyre sits here)
    const rRimIn   = Math.max(rBSD - px(6), px(6)); // inner rim flange, ~6mm inside BSD

    // Tyre cross-section — filled annulus: outer tyre down to bead seat (BSD)
    ctx.save();
    ctx.beginPath();
    ctx.arc(sx, sy, rOuter, 0, Math.PI*2, false);
    ctx.arc(sx, sy, rBSD,   0, Math.PI*2, true);
    // Tyre shading: take tubeFill colour at low opacity so it reads as
    // background-ish rather than competing with the frame tubes
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = RFIL;
    ctx.fill('evenodd');
    ctx.globalAlpha = 1.0;
    ctx.restore();

    // Outer tyre wall
    ctx.beginPath(); ctx.arc(sx, sy, rOuter, 0, Math.PI*2);
    ctx.strokeStyle = WCOL; ctx.lineWidth = WHEEL_LW; ctx.stroke();

    // Bead seat / rim outer circle (where tyre meets rim)
    ctx.beginPath(); ctx.arc(sx, sy, rBSD, 0, Math.PI*2);
    ctx.strokeStyle = RSTK; ctx.lineWidth = WHEEL_LW; ctx.stroke();

    // Inner rim flange (dashed)
    ctx.beginPath(); ctx.arc(sx, sy, rRimIn, 0, Math.PI*2);
    ctx.strokeStyle = RSTK; ctx.lineWidth = WHEEL_LW;
    ctx.setLineDash([3, 5]); ctx.stroke();
    ctx.setLineDash([]);

    // Axle dot
    drawDot(sx, sy, 3, WCOL, WCOL);
  }

  // Wheel size label above rear wheel
  const rwStr = params.rear_wheel_key || Object.entries(WHEEL_SIZES).find(([,v])=>Math.abs(v-params.rear_wheel_dia)<1)?.[0]||'';
  const [rsx,rsy] = mmToScreen(g.rear_axle[0], g.rear_axle[1]);
  if(rwStr) label(rsx, rsy - px(g.rwd) - 6, rwStr, T('wheelLbl'), 'center', 'bottom', 8);
}

// ═══════════════════════════════════════════════════════
//  DRAW TUBES
// ═══════════════════════════════════════════════════════
function drawTubes(g){
  const p=params;
  const TFILL=T('tubeFill'), TSTK=T('tubeStk'), LFILL=T('lugFill'), LSTK=T('lugStk');
  const ra=g.rear_axle, sc=g.seat_cluster;
  const ht_t=g.ht_top, ht_b=g.ht_bot, bb=[0,0];
  const tt_od=p.tt_OD, ss_od=p.ss_OD, st_od=p.st_OD;

  // BS chainstay
  tubePoly(ra, g.bs_end, p.cs_OD, TFILL, TSTK, false, false);
  // DS chainstay
  tubePoly(ra, g.ds_end, p.cs_OD, TFILL, TSTK, false, false);

  // ── HT junction ──
  const ht_od=p.ht_OD, fa_x=g.fork_axis;
  const ht_perp_cw=perp_cw(fa_x);
  const to_bb=sub(bb,ht_b);
  const ht_dt_side = dot(to_bb,ht_perp_cw)>0 ? ht_perp_cw : mul(ht_perp_cw,-1);
  const ht_tt_side = ht_dt_side;
  const dt_clr=p.dt_weld_clearance;
  const Q_dt=[ht_b[0]-fa_x[0]*dt_clr+ht_dt_side[0]*ht_od/2,
              ht_b[1]-fa_x[1]*dt_clr+ht_dt_side[1]*ht_od/2];
  const dt_ax=g.dt_ax;
  const dt_perp_cw=perp_cw(dt_ax);
  const fa_dt_dot=dot(fa_x,dt_perp_cw);
  const dt_bot_perp=fa_dt_dot>0?dt_perp_cw:mul(dt_perp_cw,-1);
  const dt_ht=[Q_dt[0]-dt_bot_perp[0]*p.dt_OD/2, Q_dt[1]-dt_bot_perp[1]*p.dt_OD/2];
  const dt_ht_ext=[dt_ht[0]+dt_ax[0]*ht_od, dt_ht[1]+dt_ax[1]*ht_od];

  const tt_clr=p.tt_weld_clearance;
  const Q_tt=[ht_t[0]+fa_x[0]*tt_clr+ht_tt_side[0]*ht_od/2,
              ht_t[1]+fa_x[1]*tt_clr+ht_tt_side[1]*ht_od/2];
  const tt_vec=norm(sub(sc,ht_t));
  const tt_perp_cw=perp_cw(tt_vec);
  const nfa_tt_dot=dot(mul(fa_x,-1),tt_perp_cw);
  const tt_top_perp=nfa_tt_dot>0?tt_perp_cw:mul(tt_perp_cw,-1);
  const tt_ht=[Q_tt[0]-tt_top_perp[0]*tt_od/2, Q_tt[1]-tt_top_perp[1]*tt_od/2];
  const tt_ht_ext=[tt_ht[0]-tt_vec[0]*ht_od, tt_ht[1]-tt_vec[1]*ht_od];

  // ST junction
  const st_tt_clr=p.st_tt_clearance;
  const st_ax=g.st_ax;
  const st_perp_cw=perp_cw(st_ax);
  const to_ra=sub(ra,sc);
  const st_rear_side=dot(to_ra,st_perp_cw)>0?st_perp_cw:mul(st_perp_cw,-1);
  const Q_tt_st=[sc[0]-st_ax[0]*st_tt_clr+st_rear_side[0]*st_od/2,
                 sc[1]-st_ax[1]*st_tt_clr+st_rear_side[1]*st_od/2];

  const tt_vec_st=norm(sub(ht_t,sc));
  const tt_perp_st_raw=perp_cw(tt_vec_st);
  const tt_perp_st=((sc[0]-Q_tt_st[0])*tt_perp_st_raw[0]+(sc[1]-Q_tt_st[1])*tt_perp_st_raw[1])<0
    ?mul(tt_perp_st_raw,-1):tt_perp_st_raw;
  const tt_sc=[Q_tt_st[0]-tt_perp_st[0]*tt_od/2, Q_tt_st[1]-tt_perp_st[1]*tt_od/2];

  const ss_vec_st=norm(sub(ra,sc));
  const ss_perp_st_raw=perp_cw(ss_vec_st);
  const ss_perp_st=((sc[0]-Q_tt_st[0])*ss_perp_st_raw[0]+(sc[1]-Q_tt_st[1])*ss_perp_st_raw[1])<0
    ?mul(ss_perp_st_raw,-1):ss_perp_st_raw;
  const ss_sc=[Q_tt_st[0]-ss_perp_st[0]*ss_od/2, Q_tt_st[1]-ss_perp_st[1]*ss_od/2];

  const tt_sc_ext=add(tt_sc,mul(tt_vec_st,st_od/2));
  const ss_sc_ext=add(ss_sc,mul(ss_vec_st,-st_od/2));

  // ── HT clip planes ──
  // Both DT and TT enter the HT from the same lateral side (ht_dt_side).
  // Clip each tube rect to stop exactly at the HT outer face on that side.
  // clipNormal = ht_dt_side (pointing INTO the HT body = inward normal)
  // clipPoint  = the HT face point on that side
  const ht_face_pt = add(ht_b, mul(ht_dt_side, ht_od / 2));  // point on HT face

  // ── Draw order: back → front ──
  // DT: clipped at HT face, capped at BB end only
  {
    let dtPoly = tubeCorners(dt_ht_ext, bb, p.dt_OD);
    dtPoly = clipHalfPlane(dtPoly, mul(ht_dt_side,-1), ht_face_pt);
    if (dtPoly.length >= 3) {
      drawPoly(dtPoly, TFILL, TSTK, TUBE_LW);
      // BB-end semicap
      const dt_bb_cap = semicap(bb, mul(dt_ax,-1), p.dt_OD/2, true, 8);
      drawPoly(dt_bb_cap, TFILL, TSTK, TUBE_LW);
    }
  }

  tubePoly(ra, ss_sc_ext, ss_od, TFILL, TSTK, false, false);

  // TT: clipped at HT face, no caps (both ends buried in other tubes)
  {
    let ttPoly = tubeCorners(tt_sc_ext, tt_ht_ext, tt_od);
    ttPoly = clipHalfPlane(ttPoly, mul(ht_dt_side,-1), ht_face_pt);
    if (ttPoly.length >= 3) drawPoly(ttPoly, TFILL, TSTK, TUBE_LW);
  }

  tubePoly(bb, sc, st_od, TFILL, TSTK, false, false);

  // BB yoke
  try {
    const yoke=bbYokeDsMM(g,p);
    if(yoke.length>=3) drawPoly(yoke,LFILL,LSTK,1);
  } catch(e){}

  // HT drawn last — clean, no masking needed now tubes are clipped
  tubePoly(ht_t, ht_b, ht_od, TFILL, TSTK, false, false);

  // BB shell
  const [bsx,bsy]=mmToScreen(0,0);
  const bb_r   = px(p.bb_diameter / 2);          // shell OD
  const bore_r = px((p.bb_bore || 33.9) / 2);    // bore ID
  ctx.beginPath(); ctx.arc(bsx,bsy,bb_r,0,Math.PI*2);
  ctx.fillStyle=LFILL; ctx.fill();
  ctx.strokeStyle=LSTK; ctx.lineWidth=TUBE_LW; ctx.stroke();
  ctx.beginPath(); ctx.arc(bsx,bsy,bore_r,0,Math.PI*2);
  ctx.fillStyle=T('bbBore'); ctx.fill();
  ctx.strokeStyle=LSTK; ctx.lineWidth=TUBE_LW; ctx.stroke();

  // Chainring dashed
  const cr_r=px(chainringRadius(p.max_chainring)+15);
  ctx.beginPath(); ctx.arc(bsx,bsy,cr_r,0,Math.PI*2);
  ctx.strokeStyle=T('crDash'); ctx.lineWidth=1;
  ctx.setLineDash([5,4]); ctx.stroke(); ctx.setLineDash([]);

  // Dropout
  const [rax,ray]=mmToScreen(g.rear_axle[0],g.rear_axle[1]);
  const do_r=px((p.cs_OD+p.ss_OD)*0.55);
  ctx.beginPath(); ctx.arc(rax,ray,do_r,0,Math.PI*2);
  ctx.fillStyle=LFILL; ctx.fill();
  ctx.strokeStyle=LSTK; ctx.lineWidth=TUBE_LW; ctx.stroke();
  ctx.beginPath(); ctx.arc(rax,ray,px(5),0,Math.PI*2);
  ctx.fillStyle='#0d0d16'; ctx.fill();
  ctx.strokeStyle=LSTK; ctx.lineWidth=TUBE_LW; ctx.stroke();
}

// ═══════════════════════════════════════════════════════
//  DRAW FORK
// ═══════════════════════════════════════════════════════
function drawFork(g){
  const p=params;
  const FCOL=T('forkFill'), FSTK=T('forkStk'), FANN=T('forkAnn');
  const fa  =g.front_axle, fc=g.fork_crown;
  const f_ax=g.fork_axis,  f_perp=g.fork_perp;
  const fo  =p.fork_offset;

  // ── Fork rake geometry diagram ──────────────────────────────
  // The classic right-angle rake triangle:
  //   • Long dashed line: HT centreline extended down through fork crown to axle height
  //   • Short dashed line: 90° offset from that line to the front axle (= rake)
  //   • Bold fork blade: hypotenuse of the triangle (crown → axle)

  // fork_axis points crown→axle direction (along steerer, downward)
  // f_perp is perpendicular to fork axis (= rake direction)
  const fa_dir = f_ax;  // unit vector along steerer axis (top→bottom)

  // Point on steerer axis at same height as front axle (foot of perpendicular)
  // front_axle = fc + f_along*fa_dir + fo*f_perp
  // The foot is: fc + f_along*fa_dir  (the mid point before the offset)
  const f_along = g.fork_along;
  const foot = [fc[0] + fa_dir[0]*f_along, fc[1] + fa_dir[1]*f_along];

  // 1. Long dashed line: fork crown → foot (along steerer CL extended)
  line(fc[0], fc[1], foot[0], foot[1], FANN, 1, [6, 4]);

  // 2. Short dashed line: foot → front axle (perpendicular offset = rake)
  line(foot[0], foot[1], fa[0], fa[1], FANN, 1, [6, 4]);

  // Small right-angle square at foot
  const sq = 6 / scale;  // 6px in mm
  const sqA = add(foot, mul(fa_dir, -sq));
  const sqB = add(sqA,  mul(f_perp,  sq));
  const sqC = add(foot, mul(f_perp,  sq));
  const [sax,say]=mmToScreen(sqA[0],sqA[1]);
  const [sbx,sby]=mmToScreen(sqB[0],sqB[1]);
  const [scx,scy]=mmToScreen(sqC[0],sqC[1]);
  const [sfx,sfy]=mmToScreen(foot[0],foot[1]);
  ctx.beginPath();
  ctx.moveTo(sax,say); ctx.lineTo(sbx,sby); ctx.lineTo(scx,scy); ctx.lineTo(sfx,sfy);
  ctx.strokeStyle=FANN; ctx.lineWidth=1; ctx.setLineDash([]); ctx.stroke();

  // 3. Fork blade (hypotenuse): fork crown → front axle — drawn on top
  tubePoly(fc, fa, 26, FCOL, FSTK, false, true);

  // Rake label — below the short offset line, near the axle end
  // Position: 80% along the offset (close to axle), then offset downward (in screen space)
  const rake_near = add(foot, mul(f_perp, fo * 0.8));
  const [rnx, rny] = mmToScreen(rake_near[0], rake_near[1]);
  label(rnx, rny + 14, `rake  ${fo.toFixed(0)}`, FANN, 'center', 'top', 9);

  // ATC label — beside the long dashed line
  const atc_mid = add(fc, mul(fa_dir, f_along*0.5));
  const [amx,amy] = mmToScreen(atc_mid[0], atc_mid[1]);
  label(amx - 8, amy, `A/C  ${g.fork_atc.toFixed(0)}`, FANN, 'right', 'middle', 9);

  // Headset x line
  const lhh=p.lower_headset_height;
  const hx1=[g.ht_bot[0]-f_perp[0]*25, g.ht_bot[1]-f_perp[1]*25];
  const hx2=[g.ht_bot[0]+f_perp[0]*25, g.ht_bot[1]+f_perp[1]*25];
  line(hx1[0],hx1[1],hx2[0],hx2[1],FANN,2,[4,3]);
  const [hxm,hym]=mmToScreen((hx1[0]+hx2[0])/2+5,(hx1[1]+hx2[1])/2);
  label(hxm+6,hym,`x=${lhh.toFixed(0)}`,FANN,'left','middle',9);

  // Fork crown dot
  const [fcs,fcs2]=mmToScreen(fc[0],fc[1]);
  drawDot(fcs,fcs2,4,FCOL,T('forkStk'));
}

// ═══════════════════════════════════════════════════════
//  DRAW COCKPIT
// ═══════════════════════════════════════════════════════
function drawCockpit(g){
  const p=params;
  const WCOL=T('wheel');
  const ha=d2r(p.ht_angle);
  const fa_x=g.fork_axis;
  const sd=[-fa_x[0],-fa_x[1]];
  const steer_h=p.steerer_height;
  const stem_len=p.stem_length;
  const stem_ang=d2r(p.stem_angle);
  const bar_r=p.bar_diameter/2;

  const stem_bot=[g.ht_top[0]+sd[0]*(steer_h-10), g.ht_top[1]+sd[1]*(steer_h-10)];
  const sfb=[Math.sin(ha), Math.cos(ha)];
  const stem_dir=[sfb[0]*Math.cos(stem_ang)-sfb[1]*Math.sin(stem_ang),
                  sfb[0]*Math.sin(stem_ang)+sfb[1]*Math.cos(stem_ang)];
  const stem_end=[stem_bot[0]+stem_dir[0]*stem_len, stem_bot[1]+stem_dir[1]*stem_len];

  // Stem line
  const [smx1,smy1]=mmToScreen(stem_bot[0],stem_bot[1]);
  const [smx2,smy2]=mmToScreen(stem_end[0],stem_end[1]);
  ctx.beginPath(); ctx.strokeStyle=WCOL; ctx.lineWidth=WHEEL_LW*2;
  ctx.lineCap='round'; ctx.moveTo(smx1,smy1); ctx.lineTo(smx2,smy2); ctx.stroke();
  ctx.lineCap='butt';

  // Bar circle
  const [bx,by]=mmToScreen(stem_end[0],stem_end[1]);
  const br=px(bar_r);
  ctx.beginPath(); ctx.arc(bx,by,br,0,Math.PI*2);
  ctx.strokeStyle=WCOL; ctx.lineWidth=WHEEL_LW; ctx.stroke();
}

// ═══════════════════════════════════════════════════════
//  DRAW ANNOTATIONS
// ═══════════════════════════════════════════════════════
function drawAnnotations(g){
  const p=params;
  const ANN=T('ann'), ANN2=T('ann2');
  const [bbx,bby]=mmToScreen(0,0);
  const [htx,hty]=mmToScreen(g.ht_top[0],g.ht_top[1]);
  const [rax,ray]=mmToScreen(g.rear_axle[0],g.rear_axle[1]);
  const [fax,fay]=mmToScreen(g.front_axle[0],g.front_axle[1]);
  const rwpx=px(g.rwd), fwpx=px(g.fwd);
  const sa=p.st_angle*DEG, ha=p.ht_angle*DEG;

  // ── Reach — arrow sits just above HT top, close to the bike ──
  if(vis.ann_reach){
    const reach_y = Math.min(bby,hty) - 22;  // 22px above highest point
    arrowH(bbx, htx, reach_y, ANN);
    label((bbx+htx)/2, reach_y-5, `reach  ${p.reach.toFixed(0)}`, ANN,'center','bottom',10);
    lineS(bbx, reach_y-4, bbx, bby+4, ANN, 1, [3,3]);
    lineS(htx, reach_y-4, htx, hty+4, ANN, 1, [3,3]);
  }

  // ── Stack — right of front axle, rotated label to left of line ──
  if(vis.ann_stack){
    const stack_x = fax + fwpx * 0.30;
    arrowV(bby, hty, stack_x, ANN);
    ctx.save();
    ctx.translate(stack_x - 12, (bby + hty) / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillStyle = ANN;
    ctx.font = "9px 'Inter',system-ui,sans-serif";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(`stack  ${g.stack.toFixed(0)}`, 0, 0);
    ctx.restore();
    lineS(stack_x - 4, bby, bbx + 4, bby, ANN, 1, [3,3]);
    lineS(stack_x - 4, hty, htx + 4, hty, ANN, 1, [3,3]);
  }

  // ── BB Drop — left of rear axle, rotated label to left of line ──
  if(vis.ann_bbdrop){
    const drop_x = rax - rwpx * 0.30;
    arrowV(ray, bby, drop_x, ANN2);
    ctx.save();
    ctx.translate(drop_x - 12, (ray + bby) / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillStyle = ANN2;
    ctx.font = "9px 'Inter',system-ui,sans-serif";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(`bb drop  ${p.bb_drop.toFixed(0)}`, 0, 0);
    ctx.restore();
    lineS(drop_x + 4, ray, rax, ray, ANN2, 1, [3,3]);
    lineS(drop_x + 4, bby, bbx - 4, bby, ANN2, 1, [3,3]);
  }

  // ── Wheelbase — at ground plane ──
  const [, wb_y]=mmToScreen(0, g.ground_y);
  if(vis.ann_wheelbase){
    arrowH(rax,fax,wb_y,ANN2);
    label((rax+fax)/2,wb_y+6,`wheelbase  ${g.wheelbase.toFixed(0)}`,ANN2,'center','top',9);
  }

  // ── Chainstay ──
  if(vis.ann_chainstay){
    const cs_y=wb_y-22;
    lineS(rax,cs_y,bbx,cs_y,ANN2,1);
    label((rax+bbx)/2,cs_y-4,`cs  ${p.chainstay_length.toFixed(0)}`,ANN2,'center','bottom',8);
  }

  // ── HT Angle ──
  if(vis.ann_htangle){
    const arcR=px(38);
    const [hbx,hby]=mmToScreen(g.ht_bot[0],g.ht_bot[1]);
    // Draw arc at HT bottom between vertical and HT axis direction
    const htAng = Math.PI/2 - ha;  // angle from vertical
    ctx.beginPath();
    ctx.arc(hbx,hby,arcR, Math.PI/2, Math.PI/2+htAng, ha<Math.PI/2);
    ctx.strokeStyle=ANN2; ctx.lineWidth=1; ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);
    label(hbx+arcR*0.7+6, hby+8, `${p.ht_angle.toFixed(1)}°`, ANN2,'left','top',9);
  }

  // ── ST Angle ──
  if(vis.ann_stangle){
    const arcR2=px(32);
    // ST angle is measured from horizontal; draw arc at BB
    const stAng = sa - Math.PI/2;
    ctx.beginPath();
    ctx.arc(bbx,bby,arcR2, -Math.PI/2, -Math.PI/2+stAng, false);
    ctx.strokeStyle=ANN; ctx.lineWidth=1; ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);
    label(bbx+arcR2*0.5+4, bby-arcR2*0.7, `${p.st_angle.toFixed(1)}°`, ANN,'left','bottom',9);
  }

  // ── ST Length ──
  if(vis.ann_stlength){
    const [scx,scy]=mmToScreen(g.seat_cluster[0],g.seat_cluster[1]);
    const mid=[(bbx+scx)/2,(bby+scy)/2];
    const perp=[-(scy-bby), scx-bbx]; // perp offset for label
    const pd=Math.hypot(perp[0],perp[1])||1;
    label(mid[0]+perp[0]/pd*18, mid[1]+perp[1]/pd*18,
      `st  ${p.st_length.toFixed(0)}`, ANN,'center','middle',9);
  }

  // ── Tube ODs (placeholder callouts) ──
  if(vis.ann_tubeODs){
    const FS=8; const COL=ANN2;
    label(bbx+14, bby-12, `DT ø${p.dt_OD}`, COL,'left','bottom',FS);
    label((bbx+(htx+fax)*0.5)/2, (bby+hty)/2-8, `TT ø${p.tt_OD}`, COL,'center','bottom',FS);
    label(bbx-14, (bby+mmToScreen(g.seat_cluster[0],g.seat_cluster[1])[1])/2,
      `ST ø${p.st_OD}`, COL,'right','middle',FS);
  }

  // ── Jig dimensions (placeholder) ──
  if(vis.ann_jig){
    const jt = params._jigType || 'type1';
    label(bbx, bby+px(40), `jig: ${jt}  [placeholder]`, ANN2,'center','top',9);
  }
}

// ═══════════════════════════════════════════════════════
//  MAIN REDRAW
// ═══════════════════════════════════════════════════════
function redraw(){
  if(cssW===0 || cssH===0) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  let g;
  try {
    g = computeGeometry(params);
  } catch(e) {
    ctx.clearRect(0,0,cssW,cssH);
    ctx.fillStyle=T('bg');
    ctx.fillRect(0,0,cssW,cssH);
    showError('Geometry: '+e.message, e);
    return;
  }

  // Always re-pin ground to fixed screen position
  // (preserves horizontal pan/zoom but locks vertical)
  pinGroundY(g);

  ctx.clearRect(0,0,cssW,cssH);
  ctx.fillStyle=T('bg');
  ctx.fillRect(0,0,cssW,cssH);
  try {
    if(vis.grid)    drawGrid(g);
    if(vis.wheels)  drawWheels(g);
    drawTubes(g);
    if(vis.fork)    drawFork(g);
    if(vis.cockpit) drawCockpit(g);
    drawAnnotations(g);
    updateStatus(g);
  } catch(e) {
    showError('Draw: '+e.message, e);
  }
}

function showError(msg, err){
  ctx.fillStyle=T('errFill');
  ctx.fillRect(10,10,cssW-20,120);
  ctx.strokeStyle='#f87171'; ctx.lineWidth=1;
  ctx.strokeRect(10,10,cssW-20,120);
  ctx.fillStyle='#f87171';
  ctx.font='bold 12px Courier New';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText('ERROR: '+msg, 20, 24);
  ctx.fillStyle='#9d8ec0';
  ctx.font='10px Courier New';
  if(err && err.stack){
    const lines=err.stack.split('\n').slice(0,6);
    lines.forEach((l,i)=>ctx.fillText(l.trim().slice(0,100), 20, 44+i*13));
  }
  console.error(err);
}

function zoomStep(factor) {
  // Zoom around canvas centre
  scale = Math.max(0.05, Math.min(5, scale * factor));
  redraw();
}

// Recompute offset[1] so ground_y (mm) maps to groundFraction * canvas.height.
// Called every redraw — this means geometry changes (wheel size, bb_drop) never
// shift the ground line. groundFraction itself is only changed by fitView or
// by vertical drag (so the user can still pan up/down deliberately).
function pinGroundY(g) {
  if (!viewPinned) return;
  // mmToScreen: sy = H/2 + offset[1] - y*scale
  // Want:  sy_ground = H * groundFraction
  // => offset[1] = H * (groundFraction - 0.5) + g.ground_y * scale
  offset[1] = cssH * (groundFraction - 0.5) + g.ground_y * scale;
}

function fitView() {
  let g;
  try { g = computeGeometry(params); } catch(e) { return; }

  const W = cssW, H = cssH;
  const rwd = g.rwd, fwd = g.fwd;

  // ── Horizontal fit ───────────────────────────────────────
  // Fit to axle-to-axle + 45% of wheel radius each side so wheels clip
  // but the complete frame is always in view.
  const minX = g.rear_axle[0]  - rwd * 0.50;
  const maxX = g.front_axle[0] + fwd * 0.50;
  const mmW  = maxX - minX;
  if (mmW < 1) return;

  scale = (W - 40) / mmW;           // 20px pad each side
  offset[0] = -((minX + maxX) / 2) * scale;

  // ── Vertical: pin ground at 78% of canvas height ─────────
  groundFraction = 0.85;
  viewPinned = true;   // re-enable pin on reset/resize
  // offset[1] will be set by pinGroundY in the next redraw.
}

function resetView(){
  fitView();
  redraw();
}

function renderToDataURL() {
  const g = computeGeometry(params);

  // Save live state
  const savedTheme = {...THEMES[currentTheme]};

  // Apply print palette (no canvas resize — use current canvas size)
  Object.assign(THEMES[currentTheme], PRINT_PALETTE);

  // Draw white background + bike over current canvas
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, cssW, cssH);
  try {
    drawGrid(g);
    drawWheels(g);
    drawTubes(g);
    if(vis.fork)    drawFork(g);
    if(vis.cockpit) drawCockpit(g);
    drawAnnotations(g);
  } catch(err){ console.error('Export draw:', err); }

  // Capture at current canvas size — low quality to keep blob small
  const dataURL = canvas.toDataURL('image/jpeg', 0.82);

  // Restore live view
  Object.assign(THEMES[currentTheme], savedTheme);
  redraw();

  return dataURL;
}




async function exportJpegAsPdf(dataURL) {
  // Decode JPEG bytes
  const b64 = dataURL.split(',')[1];
  const bin = atob(b64);
  const jpg = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) jpg[i]=bin.charCodeAt(i);

  // Parse JPEG size
  let iw=1754, ih=1240;
  for(let i=0;i<jpg.length-8;i++){
    if(jpg[i]===0xFF&&(jpg[i+1]===0xC0||jpg[i+1]===0xC2)){
      ih=(jpg[i+5]<<8)|jpg[i+6]; iw=(jpg[i+7]<<8)|jpg[i+8]; break;
    }
  }
  const PW=841.89, PH=595.28;
  const NL='\n';
  const parts=[], offs=[];
  let pos=0;
  const te=new TextEncoder();
  const ps=s=>{const b=te.encode(s);parts.push(b);pos+=b.length;};
  const pb=b=>{parts.push(b);pos+=b.length;};

  ps('%PDF-1.4'+NL+'%\xE2\xE3\xCF\xD3'+NL);
  offs.push(pos);
  ps('1 0 obj'+NL+'<< /Type /Catalog /Pages 2 0 R >>'+NL+'endobj'+NL);
  offs.push(pos);
  ps('2 0 obj'+NL+'<< /Type /Pages /Kids [3 0 R] /Count 1 >>'+NL+'endobj'+NL);
  offs.push(pos);
  ps('3 0 obj'+NL+
    '<< /Type /Page /Parent 2 0 R'+NL+
    '   /MediaBox [0 0 '+PW.toFixed(2)+' '+PH.toFixed(2)+']'+NL+
    '   /Contents 4 0 R'+NL+
    '   /Resources << /XObject << /Im1 5 0 R >> >>'+NL+
    '>>'+NL+'endobj'+NL);
  const cs='q '+PW.toFixed(2)+' 0 0 '+PH.toFixed(2)+' 0 0 cm /Im1 Do Q';
  offs.push(pos);
  ps('4 0 obj'+NL+'<< /Length '+cs.length+' >>'+NL+'stream'+NL+cs+NL+'endstream'+NL+'endobj'+NL);
  offs.push(pos);
  ps('5 0 obj'+NL+
    '<< /Type /XObject /Subtype /Image'+NL+
    '   /Width '+iw+' /Height '+ih+NL+
    '   /ColorSpace /DeviceRGB /BitsPerComponent 8'+NL+
    '   /Filter /DCTDecode /Length '+jpg.length+NL+
    '>>'+NL+'stream'+NL);
  pb(jpg);
  ps(NL+'endstream'+NL+'endobj'+NL);

  const xref=pos;
  ps('xref'+NL+'0 '+(offs.length+1)+NL);
  ps('0000000000 65535 f '+NL);
  for(const o of offs) ps(String(o).padStart(10,'0')+' 00000 n '+NL);
  ps('trailer'+NL+'<< /Size '+(offs.length+1)+' /Root 1 0 R >>'+NL);
  ps('startxref'+NL+xref+NL+'%%EOF'+NL);

  const total=parts.reduce((s,c)=>s+c.length,0);
  const pdf=new Uint8Array(total);
  let wp=0; for(const c of parts){pdf.set(c,wp);wp+=c.length;}

  const blob = new Blob([pdf], {type:'application/pdf'});
  return URL.createObjectURL(blob);
}

function showExportResult(dataURL, fmt) {
  const overlay = document.getElementById('export-result-overlay');
  const img     = document.getElementById('export-result-img');
  const msg     = document.getElementById('export-result-msg');
  const link    = document.getElementById('export-result-link');
  img.style.display  = 'none';
  link.style.display = 'none';

  if(fmt === 'jpeg') {
    img.src = dataURL;
    img.style.display = 'block';
    msg.textContent = 'long-press the image to save';
    // No download link — iOS doesn't support blob anchor download
  } else if(fmt === 'pdf') {
    msg.textContent = 'building pdf\u2026';
    overlay.classList.add('open');
    exportJpegAsPdf(dataURL).then(blobUrl => {
      // Navigate current page to blob URL — iOS opens native PDF viewer
      // with share sheet where user can save/print
      window.location.href = blobUrl;
    }).catch(e => {
      msg.textContent = 'PDF build failed: ' + e.message;
    });
    return; // overlay already opened
  }
  overlay.classList.add('open');
}

function doExport(fmt) {
  if(fmt === 'json') {
    const blob = new Blob([JSON.stringify(params,null,2)], {type:'application/json'});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = 'frame_params.json';

// ═══════════════════════════════════════════════════════
//  PARAM PANEL BUILD
// ═══════════════════════════════════════════════════════
const paramInputs={};

// ── Stack ↔ Fork ATC coupling ─────────────────────────────────────────────────
// Algebraic relationship (derived from the geometry engine):
//   stack = front_axle_y + (f_along + lower_hs + ht_len) × sin(ha) − rake × cos(ha)
//   where  f_along = √(atc² − rake²)
//          front_axle_y = bb_drop + fwd − rwd  (relative to BB centre)
//
// Rules:
//   stack slider moved   → recalculate fork_atc (HT angle / rake / headset stay fixed)
//   fork_atc slider moved → recalculate stack
//   any other param changed → stack follows from current fork_atc

function calcStackFromAtc(p) {
  const ha  = d2r(p.ht_angle);
  const fo  = p.fork_offset;
  const tw  = p.tyre_width || 57;
  const rwd = p.rear_wheel_dia  / 2 + tw;
  const fwd = p.front_wheel_dia / 2 + tw;
  const front_axle_y = p.bb_drop + fwd - rwd;
  const f_along = Math.sqrt(Math.max(0, p.fork_atc * p.fork_atc - fo * fo));
  return front_axle_y
    + (f_along + p.lower_headset_height + p.ht_length) * Math.sin(ha)
    - fo * Math.cos(ha);
}

function calcAtcFromStack(p) {
  const ha  = d2r(p.ht_angle);
  const fo  = p.fork_offset;
  const tw  = p.tyre_width || 57;
  const rwd = p.rear_wheel_dia  / 2 + tw;
  const fwd = p.front_wheel_dia / 2 + tw;
  const front_axle_y = p.bb_drop + fwd - rwd;
  const f_along = (p.stack + fo * Math.cos(ha) - front_axle_y) / Math.sin(ha)
                  - p.lower_headset_height - p.ht_length;
  if (f_along <= 0) return null;  // geometry not achievable
  const atc = Math.sqrt(f_along * f_along + fo * fo);
  const [mn, mx] = PARAM_RANGES.fork_atc;
  return Math.max(mn, Math.min(mx, atc));
}

function syncParamDisplay(key, value) {
  const rStep = (PARAM_RANGES[key] || [0, 1000, 1])[2];
  if (paramInputs[key])          paramInputs[key].value          = Number(value).toFixed(rStep < 1 ? 1 : 0);
  if (paramInputs[key + '_sld']) paramInputs[key + '_sld'].value = value;
}

function syncStackAtc(changedKey) {
  if (changedKey === 'stack') {
    const atc = calcAtcFromStack(params);
    if (atc !== null) {
      params.fork_atc = atc;
      syncParamDisplay('fork_atc', atc);
    }
  } else {
    // fork_atc changed, or any other param — stack follows
    const st = calcStackFromAtc(params);
    params.stack = st;
    syncParamDisplay('stack', st);
  }
}

// Helper to create a param input row with slider
function makeParamRow(key, labelText, body) {
  const range = PARAM_RANGES[key] || [0, 1000, 1];
  const [rMin, rMax, rStep] = range;

  const row = document.createElement('div'); row.className = 'param-row';

  // Label
  const lbl = document.createElement('span'); lbl.className = 'param-label';
  lbl.textContent = labelText;
  row.appendChild(lbl);

  // Slider row: ← [range] → [input]
  const srow = document.createElement('div'); srow.className = 'slider-row';

  const btnL = document.createElement('button'); btnL.className = 'arrow-btn';
  btnL.textContent = '‹';
  const sld = document.createElement('input');
  sld.type = 'range'; sld.className = 'param-slider';
  sld.min = rMin; sld.max = rMax; sld.step = rStep;
  sld.value = params[key] !== undefined ? params[key] : (rMin+rMax)/2;
  const btnR = document.createElement('button'); btnR.className = 'arrow-btn';
  btnR.textContent = '›';

  const inp = document.createElement('input');
  inp.type = 'text'; inp.className = 'param-input';
  inp.value = params[key] !== undefined ? Number(params[key]).toFixed(rStep < 1 ? 1 : 0) : '';

  // Sync helpers
  function apply(v) {
    const clamped = Math.max(rMin, Math.min(rMax, v));
    params[key] = clamped;
    sld.value = clamped;
    inp.value = Number(clamped).toFixed(rStep < 1 ? 1 : 0);
    syncStackAtc(key);
    redraw();
  }

  sld.oninput = () => apply(parseFloat(sld.value));
  inp.onchange = () => { const v = parseFloat(inp.value); if (!isNaN(v)) apply(v); };
  inp.onkeydown = e => {
    if (e.key === 'ArrowUp')   { e.preventDefault(); apply(params[key] + rStep); }
    if (e.key === 'ArrowDown') { e.preventDefault(); apply(params[key] - rStep); }
  };
  btnL.onclick = () => apply(params[key] - rStep);
  btnR.onclick = () => apply(params[key] + rStep);

  paramInputs[key] = inp;
  paramInputs[key + '_sld'] = sld;

  srow.appendChild(btnL); srow.appendChild(sld); srow.appendChild(btnR); srow.appendChild(inp);
  row.appendChild(srow);
  body.appendChild(row);
}

function makeGroup(scroll, name, buildFn, startOpen=true) {

let mobCurrentPage = 0;

function goToPage(n){
  mobCurrentPage = Math.max(0, Math.min(MOBILE_PAGES.length-1, n));
  const track = document.getElementById('mob-pager-track');
  if(track) track.style.transform = 'translateX('+(-mobCurrentPage*100)+'%)';
  const titleEl = document.getElementById('mob-page-title');
  if(titleEl) titleEl.textContent = MOBILE_PAGES[mobCurrentPage].title;
  updatePageDots();
  const btnL = document.getElementById('mob-nav-left');
  const btnR = document.getElementById('mob-nav-right');
  if(btnL) btnL.disabled = mobCurrentPage === 0;
  if(btnR) btnR.disabled = mobCurrentPage === MOBILE_PAGES.length - 1;
}
function updatePageDots(){
  const bar = document.getElementById('mob-page-dots');
  if(!bar) return;
  bar.querySelectorAll('.mob-page-dot').forEach((d,i)=>d.classList.toggle('active',i===mobCurrentPage));
}
function initMobileSwipe(scrollEl, track){
  let startX=0, startY=0, dx=0, dragging=false, blocked=false;
  const THRESHOLD=40, ANGLE_LOCK=35;
  scrollEl.addEventListener('touchstart', e=>{
    if(e.touches.length!==1) return;
    startX=e.touches[0].clientX; startY=e.touches[0].clientY;
    dx=0; dragging=false; blocked=false;
  },{passive:true});
  scrollEl.addEventListener('touchmove', e=>{
    if(blocked) return;
    const cx=e.touches[0].clientX, cy=e.touches[0].clientY;
    const adx=Math.abs(cx-startX), ady=Math.abs(cy-startY);
    if(!dragging && (adx>6 || ady>6)){
      const angle=Math.atan2(ady,adx)*(180/Math.PI);
      if(angle>ANGLE_LOCK){ blocked=true; return; }
      dragging=true;
    }
    if(!dragging) return;
    e.preventDefault();
    dx=cx-startX;
    const liveOffset=-mobCurrentPage*100+(dx/scrollEl.offsetWidth)*100;
    track.style.transition='none';
    track.style.transform='translateX('+liveOffset+'%)';
  },{passive:false});
  scrollEl.addEventListener('touchend', ()=>{
    if(!dragging) return;
    track.style.transition='';
    goToPage(mobCurrentPage+(dx< -THRESHOLD?1: dx>THRESHOLD?-1:0));
    dragging=false;
  },{passive:true});
}

// Generic toggle-button row (used for BB std/width, chainline, hub spacing, options, etc.)
function makeMobileButtonRow(label, options, labels, getVal, setVal, syncKey, container){
  const row=document.createElement('div'); row.className='param-row';
  const lbl=document.createElement('span'); lbl.className='param-label';
  lbl.textContent=label; row.appendChild(lbl);
  const trow=document.createElement('div');
  trow.style.cssText='display:flex;gap:4px;width:100%;margin-top:2px;';
  function sync(){
    const cur=getVal();
    options.forEach((v,i)=>{
      const active=String(v)===String(cur);
      trow.children[i].style.background  = active?'var(--accent)'   :'var(--hdr-bg)';
      trow.children[i].style.color       = active?'#fff'            :'var(--text-mid)';
      trow.children[i].style.borderColor = active?'var(--accent-br)':'var(--border)';
    });
  }
  options.forEach((v,i)=>{
    const btn=document.createElement('button');
    btn.textContent=labels?labels[i]:v;
    btn.style.cssText='flex:1;padding:3px 2px;font-family:var(--font);font-size:10px;font-weight:700;'+
      'background:var(--hdr-bg);color:var(--text-mid);border:1px solid var(--border);'+
      'border-radius:2px;cursor:pointer;transition:background 0.1s,color 0.1s;';
    btn.onclick=()=>{ setVal(v); sync(); redraw(); };
    trow.appendChild(btn);
  });
  row.appendChild(trow); container.appendChild(row);
  if(syncKey) paramInputs[syncKey]=()=>sync();
  sync();
}

function buildMobileBBRow(container){
  makeMobileButtonRow('BB Standard', Object.keys(BB_STANDARDS), null,
    ()=>params._bbStd||'BSA',
    v=>{ params._bbStd=v; const std=BB_STANDARDS[v]; params.bb_diameter=std.shell; params.bb_bore=std.bore; },
    '_bbStdSync', container);
  makeMobileButtonRow('BB Width (mm)', [68,73,83], null,
    ()=>params.bb_width, v=>params.bb_width=v, '_bbWidthSync', container);
}

function buildMobileWheelRow(item, container){
  const row=document.createElement('div'); row.className='param-row';
  const lbl=document.createElement('span'); lbl.className='param-label';
  lbl.textContent=item.label; row.appendChild(lbl);
  const trow=document.createElement('div'); trow.className='wheel-toggle-row';
  const btnL=document.createElement('button'); btnL.className='arrow-btn'; btnL.textContent='‹';
  const valSpan=document.createElement('span'); valSpan.className='wheel-val';
  const btnR=document.createElement('button'); btnR.className='arrow-btn'; btnR.textContent='›';
  function getKey(){ return params[item.keyParam]||WHEEL_KEYS[4]; }
  function setKey(k){
    params[item.keyParam]=k; params[item.diaParam]=WHEEL_SIZES[k];
    valSpan.textContent=k;
    if(item.isFront){
      const minATC=WHEEL_SIZES[k]/2+(params.tyre_width||57)+60;
      if(params.fork_atc<minATC){
        params.fork_atc=Math.round(minATC);
        if(paramInputs['fork_atc'])     paramInputs['fork_atc'].value=params.fork_atc;
        if(paramInputs['fork_atc_sld']) paramInputs['fork_atc_sld'].value=params.fork_atc;
      }
    }
    syncStackAtc('wheel'); redraw();
  }
  function step(dir){ const idx=WHEEL_KEYS.indexOf(getKey()); setKey(WHEEL_KEYS[(idx+dir+WHEEL_KEYS.length)%WHEEL_KEYS.length]); }
  valSpan.textContent=getKey();
  btnL.onclick=()=>step(-1); btnR.onclick=()=>step(1);
  paramInputs[item.storeKey]={ syncDisplay:()=>{ valSpan.textContent=getKey(); } };
  trow.appendChild(btnL); trow.appendChild(valSpan); trow.appendChild(btnR);
  row.appendChild(trow); container.appendChild(row);
}

function buildMobilePanel(){
  const scroll=document.getElementById('panel-scroll');
  scroll.innerHTML='';
  scroll.classList.add('mobile-pager');

  // ── Title bar: [‹]  PAGE TITLE  [›] ──────────────────
  const hdr=document.createElement('div');
  hdr.id='mob-page-hdr';

  const btnL=document.createElement('button');
  btnL.className='mob-page-nav-btn'; btnL.id='mob-nav-left';
  btnL.innerHTML='&#8249;';
  btnL.disabled=true;
  btnL.onclick=()=>goToPage(mobCurrentPage-1);

  const titleEl=document.createElement('span');
  titleEl.id='mob-page-title';
  titleEl.textContent=MOBILE_PAGES[0].title;

  btnR.className='mob-page-nav-btn'; btnR.id='mob-nav-right';

  hdr.appendChild(btnL); hdr.appendChild(titleEl); hdr.appendChild(btnR);

  // ── Pager track (full width, clips overflow) ──────────
  const track=document.createElement('div');
  track.className='mob-pager-track'; track.id='mob-pager-track';

  MOBILE_PAGES.forEach((pageData)=>{
    const page=document.createElement('div'); page.className='mob-page';
    pageData.items.forEach(item=>{
      if     (item.type==='slider')             makeParamRow(item.key, item.label, page);
      else if(item.type==='wheel')              buildMobileWheelRow(item, page);
      else if(item.type==='bb_std')             buildMobileBBRow(page);
      else if(item.type==='chainline_btns')
        makeMobileButtonRow('Chainline (mm)',[47.5,49,52,56],null,
          ()=>params.chainline,v=>{params.chainline=v;},'_chainlineSync',page);
      else if(item.type==='hub_spacing_btns')
        makeMobileButtonRow('Rear Hub Spacing (mm)',[142,148,157],null,
          ()=>params.rear_hub_spacing,v=>{params.rear_hub_spacing=v;},'_hubSpacingSync',page);
      else if(item.type==='frame_material_btns')
        makeMobileButtonRow('Frame Material',['stainless','titanium'],['Stainless','Titanium'],
          ()=>params.frame_material,v=>{params.frame_material=v;},'_frameMaterialSync',page);
      else if(item.type==='cable_guides_btns')
        makeMobileButtonRow('Integrated Cable Guides',[true,false],['Yes','No'],
          ()=>params.cable_guides,v=>{params.cable_guides=v;},'_cableGuidesSync',page);
    });

  });
  scroll.appendChild(track);

  // ── Page dots ─────────────────────────────────────────
  const dotsBar=document.createElement('div');
  dotsBar.className='mob-page-dots'; dotsBar.id='mob-page-dots';
  MOBILE_PAGES.forEach((_,i)=>{
    const dot=document.createElement('button');
    dot.className='mob-page-dot'+(i===0?' active':'');
    dot.title=MOBILE_PAGES[i].title;
    dot.onclick=()=>goToPage(i);
    dotsBar.appendChild(dot);
  });
  scroll.appendChild(dotsBar);

  mobCurrentPage=0;
  updatePageDots();
}

function buildPanel(){
  if(window.innerWidth<=600){ buildMobilePanel(); return; }

  const scroll=document.getElementById('panel-scroll');
  scroll.innerHTML='';
  scroll.classList.remove('mobile-pager');

  // ── 1. GEOMETRY section ───────────────────────────────
  makeGroup(scroll, 'Geometry', body=>{
    GEOM_FIELDS.forEach(([key,lbl])=>makeParamRow(key,lbl,body));
    // Wheel sizes — arrow toggles tracking by key label (not BSD value)
    function makeWheelRow(labelTxt, keyParam, diaParam, onSet, storeKey) {
      const row = document.createElement('div'); row.className = 'param-row';
      const lbl = document.createElement('span'); lbl.className = 'param-label';
      lbl.textContent = labelTxt;
      row.appendChild(lbl);

      const trow = document.createElement('div'); trow.className = 'wheel-toggle-row';
      const btnL = document.createElement('button'); btnL.className = 'arrow-btn'; btnL.textContent = '‹';
      const valSpan = document.createElement('span'); valSpan.className = 'wheel-val';
      const btnR = document.createElement('button'); btnR.className = 'arrow-btn'; btnR.textContent = '›';

      function getKey() { return params[keyParam] || WHEEL_KEYS[4]; }  // default '700c'
      function setKey(k) {
        params[keyParam] = k;
        params[diaParam] = WHEEL_SIZES[k];
        valSpan.textContent = k;
        if (onSet) onSet(WHEEL_SIZES[k]);
        syncStackAtc('wheel');
        redraw();
      }
      function step(dir) {
        const idx = WHEEL_KEYS.indexOf(getKey());
        setKey(WHEEL_KEYS[(idx + dir + WHEEL_KEYS.length) % WHEEL_KEYS.length]);
      }
      valSpan.textContent = getKey();
      btnL.onclick = () => step(-1);
      btnR.onclick = () => step(1);

      // syncDisplay called from setParams when loading a preset
      paramInputs[storeKey] = { syncDisplay: () => { valSpan.textContent = getKey(); } };

      trow.appendChild(btnL); trow.appendChild(valSpan); trow.appendChild(btnR);
      row.appendChild(trow);
      body.appendChild(row);
    }

    makeWheelRow('Front Wheel', 'front_wheel_key', 'front_wheel_dia', v=>{
      // ATC minimum = outer wheel radius + 60mm crown clearance
      const minATC = v/2 + (params.tyre_width||57) + 60;
      if (params.fork_atc < minATC) {
        params.fork_atc = Math.round(minATC);
        if (paramInputs['fork_atc'])     paramInputs['fork_atc'].value = params.fork_atc;
        if (paramInputs['fork_atc_sld']) paramInputs['fork_atc_sld'].value = params.fork_atc;
      }
    }, '_frontWheel');
    makeWheelRow('Rear Wheel', 'rear_wheel_key', 'rear_wheel_dia', null, '_rearWheel');
    makeParamRow('tyre_width', 'Tyre Width (mm)', body);
  }, true);

  // ── 2. FORK section ──────────────────────────────────
  makeGroup(scroll, 'Fork', body=>{
    FORK_FIELDS.forEach(([key,lbl])=>makeParamRow(key,lbl,body));
  }, true);

  // ── 3. TUBE PARAMETERS label (non-collapsible divider) ──
  const divider=document.createElement('div');
  divider.style.cssText='padding:8px 11px 3px;font-size:9px;letter-spacing:2px;color:var(--text-lo);text-transform:uppercase;font-family:Courier New,monospace;border-top:1px solid var(--border);margin-top:4px;';
  divider.textContent='tube parameters';
  scroll.appendChild(divider);

  // ── 4. Bottom Bracket (standard + width toggle) ──────────
  makeGroup(scroll, 'Bottom Bracket', body=>{
    // Standard select
    const bbOpts=Object.keys(BB_STANDARDS).map(k=>[k,k]);
    makeSelectRow('Standard', bbOpts, 'BSA',
      v=>{ const std=BB_STANDARDS[v]; params.bb_diameter=std.shell; params.bb_bore=std.bore; redraw(); }, body);

    // Width 3-way toggle: 68 / 73 / 83
    const BB_WIDTHS = [68, 73, 83];
    const wrow = document.createElement('div'); wrow.className='param-row';
    const wlbl = document.createElement('span'); wlbl.className='param-label';
    wlbl.textContent='Width (mm)';
    wrow.appendChild(wlbl);

    const trow = document.createElement('div');
    trow.style.cssText='display:flex;gap:4px;width:100%;margin-top:2px;';

    BB_WIDTHS.forEach(w=>{
      const btn=document.createElement('button');
      btn.textContent=w;
      btn.style.cssText='flex:1;padding:4px 2px;font-family:var(--font);font-size:11px;font-weight:700;'+
        'background:var(--hdr-bg);color:var(--text-mid);border:1px solid var(--border);'+
        'border-radius:2px;cursor:pointer;transition:background 0.1s,color 0.1s;';
      function sync(){
        BB_WIDTHS.forEach((ww,i)=>{
          trow.children[i].style.background = params.bb_width===ww ? 'var(--accent)' : 'var(--hdr-bg)';
          trow.children[i].style.color      = params.bb_width===ww ? '#fff'          : 'var(--text-mid)';
          trow.children[i].style.borderColor= params.bb_width===ww ? 'var(--accent-br)':'var(--border)';
        });
      }
      btn.onclick=()=>{ params.bb_width=w; sync(); redraw(); };
      trow.appendChild(btn);
    });

    wrow.appendChild(trow);
    body.appendChild(wrow);

    // Store sync ref so setParams can update display
    paramInputs._bbWidthSync = ()=>{
      BB_WIDTHS.forEach((ww,i)=>{
        trow.children[i].style.background = params.bb_width===ww ? 'var(--accent)' : 'var(--hdr-bg)';
        trow.children[i].style.color      = params.bb_width===ww ? '#fff'          : 'var(--text-mid)';
        trow.children[i].style.borderColor= params.bb_width===ww ? 'var(--accent-br)':'var(--border)';
      });
    };
    // Initial highlight
    paramInputs._bbWidthSync();
  }, true);

  // ── 5. Tube groups ────────────────────────────────────
  GROUPS.forEach(({name,fields})=>{
    // Bottom Bracket already done above — skip it here
    if(name==='Bottom Bracket') return;
    makeGroup(scroll, name, body=>{
      fields.forEach(([key,lbl])=>makeParamRow(key,lbl,body));
    }, false);  // start collapsed to save space
  });
}

function setParams(p){
  Object.assign(params,p);
  params.stack = calcStackFromAtc(params);
  for(const [k,inp] of Object.entries(paramInputs)){
    if(k.startsWith('_')) {
      if(inp && typeof inp.syncDisplay === 'function') inp.syncDisplay();
      if(typeof inp === 'function') inp();  // _bbWidthSync
      continue;
    }
    if(k.endsWith('_sld')) {
      // Sync slider position
      if(params[k.slice(0,-4)] !== undefined) inp.value = params[k.slice(0,-4)];
      continue;
    }
    if(params[k]!==undefined){
      const range = PARAM_RANGES[k];
      inp.value = range && range[2] < 1
        ? Number(params[k]).toFixed(1)
        : params[k];
    }
  }
  redraw();
}

function exportJSON(){
  const author=(document.getElementById('export-author')||{}).value||'';
  const out={
    _meta:{ author, date:new Date().toISOString(), version:'1.0' },
    ...params
  };
  const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='frame_geometry.json'; a.click();
}

function importJSON(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json';
  inp.onchange=e=>{
    const r=new FileReader();
    r.onload=ev=>{
      try{
        const {_meta,...frameParams}=JSON.parse(ev.target.result);
        setParams(frameParams);
      }catch(err){ alert('Invalid JSON'); }
    };
    r.readAsText(e.target.files[0]);
  };
  inp.click();
}

    'Mid':  _p(185,315,55,75,110,44.5,33,8,72,300,28.6,'20"','20"',350,50,5),
    'Large':_p(200,330,55,75,110,44.5,33,8,72,310,28.6,'20"','20"',355,50,5),
  },
};

function buildPresetPanel(){
  const catSel=document.getElementById('preset-cat');
  Object.keys(PRESETS).forEach(cat=>{
    const o=document.createElement('option'); o.value=cat; o.textContent=cat; catSel.appendChild(o);
  });
  updatePresetSizes();
}

function updatePresetSizes(){
  const cat=document.getElementById('preset-cat').value;
  const sizeSel=document.getElementById('preset-size');
  sizeSel.innerHTML='';
  Object.keys(PRESETS[cat]||{}).forEach(s=>{
    const o=document.createElement('option'); o.value=s; o.textContent=s; sizeSel.appendChild(o);
  });
  const sizes=Object.keys(PRESETS[cat]||{});
  const def=sizes.includes('M')?'M': sizes.includes('Large')?'Large':sizes[0];
  if(def) sizeSel.value=def;
}

function loadPreset(){
  const cat=document.getElementById('preset-cat').value;
  const size=document.getElementById('preset-size').value;
  const p=PRESETS[cat]?.[size];
  if(p) setParams(p);
}

function togglePresets(){
  const body=document.getElementById('preset-body');
  const btn=document.getElementById('preset-toggle');
  const open=body.classList.toggle('open');
  btn.classList.toggle('open',open);
  btn.textContent=open?'Presets ▾':'Presets ▸';
}

// ═══════════════════════════════════════════════════════
//  PANEL RESIZER
// ═══════════════════════════════════════════════════════
const resizer=document.getElementById('resizer');
const panel  =document.getElementById('panel');
let rsz=null;
resizer.addEventListener('mousedown',e=>{ rsz=e.clientX; e.preventDefault(); });
window.addEventListener('mousemove',e=>{
  if(rsz===null) return;
  const w=Math.max(180,Math.min(500,panel.offsetWidth+(e.clientX-rsz)));
  panel.style.width=w+'px';
  rsz=e.clientX;
  resizeCanvas();
});
window.addEventListener('mouseup',()=>rsz=null);

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
// Global error catcher — shows any uncaught error on canvas
window.addEventListener('error', e=>{
  if(cssW>0){
    ctx.fillStyle=T('errFill'); ctx.fillRect(10,10,cssW-20,80);
    ctx.strokeStyle='#f87171'; ctx.lineWidth=1; ctx.strokeRect(10,10,cssW-20,80);
    ctx.fillStyle='#f87171'; ctx.font='bold 12px Courier New';
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText('JS ERROR: '+e.message, 20, 24);
    ctx.fillStyle=T('text-hi'); ctx.font='10px Courier New';
    ctx.fillText('File: '+e.filename+' Line: '+e.lineno, 20, 44);
  }
});

params.stack = calcStackFromAtc(params);
try { buildPanel(); } catch(e){ console.error('buildPanel failed:',e); }
try { buildPresetPanel(); } catch(e){ console.error('buildPresetPanel failed:',e); }

// Populate view panel preset selects
(function buildViewPanelPresets(){
  const catSel=document.getElementById('vp-preset-cat');
  if(!catSel) return;
  Object.keys(PRESETS).forEach(cat=>{
    const o=document.createElement('option'); o.value=cat; o.textContent=cat;
    catSel.appendChild(o);
  });
  vpUpdatePresetSizes();
})();

// Rebuild panel layout when crossing the mobile/desktop breakpoint
let _lastMobileState = window.innerWidth<=600;
window.addEventListener('resize',()=>{
  const isMobile=window.innerWidth<=600;
  if(isMobile!==_lastMobileState){
    _lastMobileState=isMobile;
    try{ buildPanel(); }catch(e){ console.error('buildPanel resize:',e); }
  }
});

// Delay initial draw until browser has computed layout
requestAnimationFrame(()=>{
  requestAnimationFrame(()=>{
    dpr   = window.devicePixelRatio || 1;
    cssW  = wrap.clientWidth;
    cssH  = wrap.clientHeight;
    canvas.width  = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    canvas.style.width  = cssW + 'px';
    canvas.style.height = cssH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fitView();
    redraw();
  });
});
</script>
